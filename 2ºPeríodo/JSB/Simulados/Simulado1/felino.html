<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos felinos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <div class="container-gatos">
        <div>
            <img src="img/gato01.gif" id="gato01">
            <p>Clique em mim!</p>
        </div>
        <div>
            <img src="img/gato02.gif" id="gato02">
            <p>Clique em mim várias vezes</p>
            <p>Carinho <span id="contador">0</span></p>
        </div>
        <div>
            <img src="img/gato03.gif" id="gato03">
            <p>Passe o cursor do mouse por cima de mim!</p>
        </div>
        <div>
            <img src="img/gato04.gif" id="gato04">
            <p id="msgGato04">lá lá lá...</p>
        </div>
        <div>
            <img src="img/gato05.gif" id="gato05">
            <input type="button" value="Gerar número da sorte" id="btnGerar" class="btnGerar">
            <input type="text" id="numeroAleatório">
        </div>
    </div>
</body>

</html>

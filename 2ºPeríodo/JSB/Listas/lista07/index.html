<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/script.js" defer></script>
    <script src="jMaskWiFi/js/jMaskWiFi.js" defer></script>
</head>

<body>
    <form>
        <label for="campoDataNasc">Data de Nascimento: </label>
        <input type="text" id="campoDataNasc" value="20/07/1995">
        <input type="button" value="Validar" id="btnValidar1">
        <br>
        <label for="campoDataNasc">CPF: </label>
        <input type="text" id="campoCPF" value="123.321.654-91"
            onkeypress="inserirMascara('campoCPF','000.000.000-00')">
        <input type="button" value="Validar" id="btnValidar2">
        <br>
        <label for="campoMatricula">Número de matrícula do IFTM: </label>
        <input type="text" id="campoMatricula" value="IFTM-123/324-xy">
        <input type="button" value="Validar" id="btnValidar3">
        <br>
        <label for="campoCodDisc1">Código de uma disciplina do IFTM A: </label>
        <input type="text" id="campoCodDisc1" onkeypress="inserirMascara('campoCodDisc1','aa-00.000-aaaa')"
            value="MT-12.123-IFTM">
        <input type="button" value="Validar" id="btnValidar4">
        <br>
        <label for="campoCodDisc2">Código de uma disciplina do IFTM B:</label>
        <input type="text" id="campoCodDisc2" onkeypress="inserirMascara('campoCodDisc1','aa-00.000-aaaa')"
            value="MT-12.123-iftm">
        <input type="button" value="Validar" id="btnValidar5">
        <br>
        <label for="campoCodDisc3">Código de uma disciplina do IFTM C:</label>
        <input type="text" id="campoCodDisc3" value="MT-12.123-if tm">
        <input type="button" value="Validar" id="btnValidar6">
        <br>
        <label for="campoNomeCampus">Nome de campus do IFTM: </label>
        <input type="text" id="campoNomeCampus" value="IFTM campus Uberlândia">
        <input type="button" value="Validar" id="btnValidar7">
        <br>
        <label for="campoTelefone1">Telefone A: </label>
        <input type="text" id="campoTelefone1" value="+55(34)92312-3532"
            onkeypress="inserirMascara('campoTelefone1','+00(00)00000-0000')">
        <input type="button" value="Validar" id="btnValidar8">
        <br>
        <label for="campoTelefone2">Telefone B: </label>
        <input type="text" id="campoTelefone2" value="(34) 92312-3532">
        <input type="button" value="Validar" id="btnValidar9">
        <br>
        <label for="campoAltura">Altura: </label>
        <input type="text" id="campoAltura" value="1.67">
        <input type="button" value="Validar" id="btnValidar10">
        <br>
        <label for="campoFaturamento">Faturamento anual de uma empresa: </label>
        <input type="text" id="campoFaturamento" value="R$1000,00">
        <input type="button" value="Validar" id="btnValidar11">
        <br>
        <label for="campoCronometro">Cronômetro: </label>
        <input type="text" id="campoCronometro" onkeypress="inserirMascara('campoCronometro','00:00:00:00')" value="12:45:32:88">
        <input type="button" value="Validar" id="btnValidar12">
    </form>
</body>

</html>
